// Les sept zones. Celles qu'on n'a pas débloquées restent visitables — c'est un
// aperçu, son intérêt est qu'on voie les sept monstres — mais les gains n'y
// comptent pas, sinon la progression n'a plus aucun sens.
function zonesSheet() {
  G.running = false;
  const rows = ZONES.map(z => {
    const open = zoneUnlocked(z);
    const here = z.id === G.zone;
    const m = MONSTERS[z.monster];
    return `<div class="item"><div>
      <div class="n">${z.order}. ${z.name} ${here ? '<span style="color:var(--accent)">— tu y es</span>' : ""}</div>
      <div class="d">${z.blurb}</div>
      <div class="l">${money(z.rate)}/s · ${m.name} · ${z.mech}</div>
      <div class="l" style="color:${open ? "var(--cash)" : "var(--dim)"}">${
        open ? "débloquée" : "il faut " + money(z.unlock) + " déposés — visitable en aperçu"}</div>
      </div>
      <button type="button" data-go="${z.id}" ${here ? "disabled" : ""}>${
        here ? "ICI" : (open ? "Entrer" : "Aperçu")}</button></div>`;
  }).join("");
  openSheet("zones", `<div class="card"><h2>Les sept zones</h2>
    <p>${money(G.totalBanked)} déposés à vie.</p>
    <div class="shop-list">${rows}</div>
    <div class="row"><button type="button" id="b-cl">Fermer</button></div></div>`);
  $("b-cl").onclick = () => { closeSheet(); G.running = true; };
  for (const b of document.querySelectorAll("[data-go]")) b.onclick = () => travel(b.dataset.go);
}

function shopSheet() {
  G.running = false;
  const rows = SHOP.map(it => {
    const have = G.owned[it.id] || 0;
    const can = G.cash >= it.price;
    const placed = G.placed[it.id] || 0;
    const detail = it.kind === "weapon"
      ? `${it.dmg} de dégâts · étourdit ${String(it.stun).replace(".", ",")} s · recharge ${String(it.cd).replace(".", ",")} s`
      : `${it.slots} emplacement${it.slots > 1 ? "s" : ""} · ${it.dur} usages`
        + (it.delay ? ` · retient ${it.delay} s` : "")
        + (it.warn ? ` · prévient ${String(it.warn).replace(".", ",")} s` : "");
    const action = it.kind === "weapon"
      ? (have ? (G.weapon === it.id
          ? `<button type="button" disabled>ÉQUIPÉE</button>`
          : `<button type="button" data-eq="${it.id}">Équiper</button>`)
        : `<button type="button" data-buy="${it.id}" ${can ? "" : "disabled"}>${money(it.price)}</button>`)
      : (have > placed
        ? `<button type="button" data-place="${it.id}">Poser</button>`
        : `<button type="button" data-buy="${it.id}" ${can ? "" : "disabled"}>${money(it.price)}</button>`);
    return `<div class="item"><div><div class="n">${it.name}</div><div class="d">${it.desc}</div>
      <div class="l">${detail}</div>
      <div class="l">${it.kind === "weapon" ? (have ? "possédée" : "zone " + ZONE_BY_ID[it.zone].name)
        : `possédées ${have} · posées ${placed}`}</div></div>${action}</div>`;
  }).join("");
  const d = defenseProfile();
  openSheet("shop", `<div class="card"><h2>Boutique</h2>
    <p>${money(G.cash)} en banque. Refuge : ${d.slots}/${MAX_SLOTS} emplacements,
    ${d.delay.toFixed(0)} s de délai, détection −${Math.round(d.cut * 100)} %.</p>
    <div class="shop-list">${rows}</div>
    <div class="row"><button type="button" id="b-cl">Fermer</button></div></div>`);
  $("b-cl").onclick = () => { closeSheet(); G.running = true; };
  for (const b of document.querySelectorAll("[data-buy]")) b.onclick = () => {
    const it = SHOP_BY_ID[b.dataset.buy];
    if (G.cash < it.price) return;
    G.cash -= it.price; G.owned[it.id] = (G.owned[it.id] || 0) + 1;
    if (it.kind === "weapon" && !G.weapon) G.weapon = it.id;
    save(); toast(`${it.name} acheté — ${money(it.price)}.`, "cash"); sfx.cash(); shopSheet();
  };
  for (const b of document.querySelectorAll("[data-eq]")) b.onclick = () => {
    G.weapon = b.dataset.eq; save(); toast(`${SHOP_BY_ID[G.weapon].name} équipée.`, "info"); shopSheet();
  };
  for (const b of document.querySelectorAll("[data-place]")) b.onclick = () => {
    const it = SHOP_BY_ID[b.dataset.place];
    const d2 = defenseProfile();
    if (d2.slots + (it.slots || 1) > MAX_SLOTS) {
      toast(`Plus de place : ${MAX_SLOTS} emplacements par refuge.`, "warn"); return;
    }
    G.placed[it.id] = (G.placed[it.id] || 0) + 1;
    toast(`${it.name} posée dans le refuge.`, "info"); shopSheet();
  };
}

function reveal(def) {
  G.running = false;
  openSheet("reveal", `<div class="card bc">
    <div class="k">TU VIENS D'EN RÉVEILLER UN</div>
    <div class="n" style="color:#${def.eye.toString(16).padStart(6, "0")}">${def.name}</div>
    <div class="t">${def.tell}</div>
    <div class="k" style="margin-top:4px">COMMENT T'EN SORTIR</div>
    <div class="c">${def.counter}</div>
    <div class="k" style="margin-top:6px;color:var(--faint)">partie en pause — une touche de déplacement reprend</div>
    <div class="row"><button type="button" id="b-go">J'ai compris — cours</button></div></div>`);
  $("b-go").onclick = () => { closeSheet(); G.running = true; };
}

// ─── économie ──────────────────────────────────────────────────────────────
function bank() {
  if (G.unbanked <= 0) return 0;
  const a = Math.floor(G.unbanked);
  G.cash += a; G.totalBanked += a; G.unbanked = 0;
  save();
  sfx.cash();
  for (const z of ZONES) {
    if (z.unlock > 0 && G.totalBanked >= z.unlock && !G.seen["u" + z.id]) {
      G.seen["u" + z.id] = true;
      toast(`${z.name} débloquée — N pour y aller.`, "unlock");
      sfx.unlock();
    }
  }
  return a;
}

function travel(zoneId) {
  const z = ZONE_BY_ID[zoneId];
  if (!z || zoneId === G.zone) return;
  if (G.sleeping) wake("travel");
  G.zone = zoneId;
  G.preview = !zoneUnlocked(z);
  clearBeasts();
  buildZone(zoneId);
  buildWorldMeshes();
  G.px = spawn.x; G.pz = spawn.z; G.dead = 0;
  G.placed = {}; G.defHits = {};   // les défenses restent au refuge quitté
  G.bossPhase = 0; G.bossHits = 0;
  scene.fog.color.setHex(pal().fog);
  renderer.setClearColor(pal().fog);
  hemi.intensity = zoneId === "hub" ? 0.5 : 0.18;
  if (z.order > G.deepest) { G.deepest = z.order; save(); }
  closeSheet();
  G.running = true;
  // ⚠️ Sans ce verrou, on arrive dans la zone À CÔTÉ du portail de retour, il
  // se déclenche dans la même seconde, et on fait l'aller-retour en boucle.
  G.portalLock = G.time + 1.5;
  if (zoneId === "hub") {
    toast("Le parvis. Lis les bornes, puis prends un portail.", "info");
    return;                       // aucun monstre ici, c'est tout l'intérêt
  }
  toast(G.preview
    ? `${z.name} — aperçu. Les gains ne comptent pas ici.`
    : `${z.name}. ${money(z.rate)}/s.`, G.preview ? "warn" : "info");
  // Le monstre de la zone est déjà là. On n'entre pas dans une zone vide.
  spawnBeast(MONSTERS[z.monster], null, true);
}

// Le joueur est-il dans un portail ? (Rectangle, pas rayon : on traverse un
// portail de face, on ne tourne pas autour.)
function portalUnder() {
  for (const pt of portals)
    if (Math.abs(G.px - pt.x) < pt.w / 2 && Math.abs(G.pz - pt.z) < pt.d) return pt;
  return null;
}
function nearSign() {
  for (const sg of signs)
    if (Math.hypot(G.px - sg.x, G.pz - sg.z) < 9) return sg;
  return null;
}

// ─── sommeil : une session, pas une nuit ───────────────────────────────────
// Le jeu Roblox ne compte pas les nuits : il compte des SESSIONS. On dort, on
// gagne par seconde, et la session s'arrête d'elle-même au bout de
// MaxSessionSeconds. C'est ce qui empêche le farm passif.
function nearShelter() {
  for (const s of shelters)
    if (Math.abs(G.px - s.x) < s.w * 0.9 && Math.abs(G.pz - s.z) < s.d * 0.8) return s;
  return null;
}
function trySleep(s) {
  const z = zone();
  G.sleeping = s; G.earnedHere = 0;
  G.sessionLeft = z.max; G.graceLeft = GRACE;
  G.nextAssault = G.time + ASSAULT_BASE + (Math.random() - 0.5) * ASSAULT_JITTER;
  G.incoming = 0;
  G.px = s.x; G.pz = s.z;
  sfx.sleep();
  toast(`Tu dors. ${mmss(z.max)} de session, ${money(z.rate)}/s après ${GRACE} s.`, "info");
}
function wake(reason) {
  if (!G.sleeping) return;
  const z = zone();
  G.sleeping = null; G.incoming = 0;
  if (reason === "complete") {
    G.nights++; save();
    toast(`Session terminée. ${money(G.unbanked)} sur toi — va les déposer.`, "cash");
  } else if (reason === "manual") {
    toast(`Réveillé. ${money(G.unbanked)} sur toi.`, "info");
  }
}

// L'assaut : le monstre le plus proche est envoyé sur le refuge, et les
// défenses lui coûtent du temps avant d'arriver.
function launchAssault() {
  const z = zone();
  const def = MONSTERS[z.monster];
  const d = defenseProfile();
  const m = MONSTERS[z.monster];

  // §5 — « fake_alerts » : une alerte sur trois est fausse. C'est la mécanique
  // de l'hôpital, et elle n'a de sens que si la fausse est indiscernable.
  const fake = m.rule === "fake_alerts" && Math.random() < 0.34;

  // « disable » : l'Entité du couvent neutralise les défenses. Le délai tombe,
  // et l'alarme ne prévient pas.
  const disabled = m.rule === "disable";
  const delay = disabled ? 0 : d.delay;
  const warn = disabled ? 0 : d.warn;

  if (warn > 0 && !disabled) {
    sfx.alarm();
    toast(fake ? "L'alarme hurle." : "L'alarme hurle — quelque chose vient.", "danger");
  } else if (disabled) {
    toast("Les alarmes se taisent une par une.", "danger");
  }
  if (fake) {
    // Rien ne vient. On consomme quand même l'usure de l'alarme : c'est
    // précisément le coût de la mécanique.
    for (const id in G.placed) if (SHOP_BY_ID[id] && SHOP_BY_ID[id].warn) G.defHits[id] = (G.defHits[id] || 0) + 1;
    return;
  }

  for (const id in G.placed) {
    if (!G.placed[id]) continue;
    G.defHits[id] = (G.defHits[id] || 0) + 1;
    const it = SHOP_BY_ID[id];
    if (it && G.defHits[id] === it.dur * G.placed[id]) {
      toast(`${it.name} a cédé.`, "warn"); sfx.door();
    }
  }

  G.incoming = Math.max(0.6, delay + warn);
  G.shoutText = "IL ARRIVE — COURS"; G.shoutUntil = G.time + G.incoming;
  spawnBeast(def, G.incoming);
  if (!G.seen[def.id]) { G.seen[def.id] = true; save(); reveal(def); }
}

// ─── monstres ──────────────────────────────────────────────────────────────
// Les sept mécaniques du CDC §5, et c'est `rule` qui les porte :
//   none         le Rôdeur     — chasse à vue, lâche au bout de 12 s
//   sound        la Chose      — voit mal, entend tout : c'est courir qui l'appelle
//   gaze         la Poupée     — figée tant qu'on la regarde
//   relentless   le Masque     — lent, et ne lâche jamais
//   disable      l'Entité      — neutralise les défenses du refuge
//   fake_alerts  le Menteur    — une alerte sur trois est fausse
//   boss_phases  le Clown      — trois phases qui rejouent sound, gaze, relentless
function ruleOf(b) {
  if (b.def.rule !== "boss_phases") return b.def.rule;
  return BOSS_PHASES[Math.min(G.bossPhase, BOSS_PHASES.length - 1)].rule;
}
function statsOf(def, b) {
  const s = STAGES[G.stage];
  let speed = def.speed, sight = def.sight;
  if (def.rule === "boss_phases" && b) {
    const ph = BOSS_PHASES[Math.min(G.bossPhase, BOSS_PHASES.length - 1)];
    speed = ph.speed; sight = ph.sight;
  }
  return { speed: speed * s.speed, sight: sight * s.sight, catch: def.catch + G.stage * 0.4 };
}
function clearBeasts() {
  for (const b of G.beasts) despawn(b);
  G.beasts.length = 0;
}
function despawn(b) {
  actors.remove(b.obj);
  if (b.lamp) actors.remove(b.lamp);
}
function spawnBeast(def, win, patrolMode) {
  let inst = G.beasts.find(b => b.def.id === def.id);
  if (!inst) {
    const scale = def.height / 5;
    // Le Menteur porte TES couleurs : de loin, on croit voir un autre joueur.
    const look = def.mimic
      ? { shirt: PLAYER_LOOK.shirt, pants: PLAYER_LOOK.pants, skin: PLAYER_LOOK.skin, face: "wrong" }
      : { shirt: def.body, pants: def.body, skin: def.body, face: def.face };
    inst = { def, obj: makeAvatar(Object.assign(look, {
      eyes: def.eyes, eye: def.eye, scale, armLen: def.arm / scale,
      crawl: def.crawl, thin: def.thin, hat: def.hat })) };
    if (def.lantern) {
      inst.lamp = new THREE.PointLight(0xffc478, 2.0, 46);
      actors.add(inst.lamp);
      inst.obj.add(box(0.8, 1, 0.8, new THREE.MeshBasicMaterial({ color: 0xffc478 }), 1.6 * scale, 0.2, 0));
    }
    // Halo sur les yeux : dans le noir, c'est souvent tout ce qu'on voit.
    const halo = glow(def.eye, def.height * 0.5);
    halo.position.set(0, def.height * 0.34, -0.4);
    inst.obj.add(halo);
    inst.halo = halo;
    actors.add(inst.obj);
    G.beasts.push(inst);
  }
  let at;
  if (win) {
    const want = Math.max(22, win * statsOf(def, inst).speed);
    let best = patrol[0], err = Infinity;
    for (const p of patrol) {
      const d = Math.hypot(p.x - G.px, p.z - G.pz);
      if (d > 14 && Math.abs(d - want) < err) { err = Math.abs(d - want); best = p; }
    }
    at = best || patrol[0];
  } else {
    const far = patrol.filter(p => Math.hypot(p.x - G.px, p.z - G.pz) > 45);
    const pool = far.length ? far : patrol;
    at = pool[Math.floor(Math.random() * pool.length)];
  }
  if (!at) at = { x: spawn.x, z: spawn.z };
  inst.x = at.x; inst.z = at.z;
  inst.mode = patrolMode ? "patrol" : "hunt";
  inst.last = { x: G.px, z: G.pz };
  inst.path = []; inst.repath = 0; inst.lost = 0; inst.still = 0;
  inst.stun = 0;
  inst.ends = G.time + def.giveUp;
  inst.pi = 0; inst.walk = 0; inst.angle = 0;
}

// Le joueur le regarde-t-il ? (La Poupée se fige sous le regard.)
function observed(b) {
  const dx = b.x - G.px, dz = b.z - G.pz, d = Math.hypot(dx, dz);
  if (d < 0.1) return true;
  if (d > 130) return false;
  const fx = -Math.sin(G.yaw), fz = -Math.cos(G.yaw);
  return (fx * dx + fz * dz) / d > 0.35 && los(G.px, G.pz, b.x, b.z);
}

function updateBeast(b, dt) {
  const s = statsOf(b.def, b);
  const rule = ruleOf(b);
  const d = Math.hypot(b.x - G.px, b.z - G.pz);

  if (b.stun > 0) {
    b.stun -= dt;
    animateLimbs(b.obj, b.walk, 0);
    b.obj.visible = los(G.px, G.pz, b.x, b.z) && d < STAGES[G.stage].fog * 1.6;
    b.obj.position.set(b.x, b.def.height * 0.52, b.z);
    if (b.halo) b.halo.material.opacity = 0.35;
    return;
  }
  if (b.halo) b.halo.material.opacity = 1;

  // « sound » : elle ne voit presque rien, mais elle entend. Courir, c'est
  // l'appeler ; marcher, c'est se cacher.
  const loud = G.sprint && G.moving;
  const heard = rule === "sound" && d <= b.def.hear * (loud ? 1 : 0.45) * STAGES[G.stage].sight;
  const canSee = rule === "sound"
    ? (heard || (d <= s.sight * 0.5 && los(b.x, b.z, G.px, G.pz)))
    : (d <= s.sight && los(b.x, b.z, G.px, G.pz));

  if (b.mode === "patrol") {
    if (canSee && !G.sleeping) {
      b.mode = "hunt"; b.ends = G.time + b.def.giveUp; b.lost = 0; b.path = []; b.repath = 0;
      toast(`${b.def.name} t'a vu.`, "danger"); sfx.growl();
      G.shoutText = "IL T'A VU"; G.shoutUntil = G.time + 1.6;
      if (!G.seen[b.def.id]) { G.seen[b.def.id] = true; save(); reveal(b.def); }
    }
  }

  if (b.mode === "hunt") {
    if (canSee) { b.last = { x: G.px, z: G.pz }; b.lost = 0; }
    else {
      b.lost += dt;
      // « relentless » : il ne perd jamais la trace. Les autres, oui.
      if (rule !== "relentless" && b.lost >= 3) { b.mode = "search"; b.path = []; }
    }
    if (rule === "relentless") b.last = { x: G.px, z: G.pz };
    if (rule !== "relentless" && G.time >= b.ends) {
      b.mode = "patrol"; b.path = []; toast("Il a lâché la piste.", "info");
    }
  }

  if (b.mode === "search") {
    const toLast = b.last ? Math.hypot(b.x - b.last.x, b.z - b.last.z) : 0;
    if (!b.last || toLast < 6) { b.mode = "patrol"; b.path = []; }
  }

  let target = null;
  if (b.mode === "hunt") target = b.last || { x: G.px, z: G.pz };
  else if (b.mode === "search") target = b.last;
  else {
    if (!b.pt || Math.hypot(b.x - b.pt.x, b.z - b.pt.z) < 6) {
      b.pi = (b.pi + 1) % Math.max(1, patrol.length);
      b.pt = patrol[b.pi] || { x: spawn.x, z: spawn.z };
      b.path = []; b.repath = 0;
    }
    target = b.pt;
  }
  if (target && G.time >= b.repath) { b.repath = G.time + 0.4; b.path = findPath(b, target); }

  // « gaze » : regardée, elle ne bouge pas du tout. C'est toute la mécanique
  // de la maison des poupées, et elle doit être absolue pour être lisible.
  const frozen = rule === "gaze" && observed(b);
  const speed = frozen ? 0 : (b.mode === "patrol" ? s.speed * 0.6 : s.speed);

  let n = b.path[0];
  while (n && Math.hypot(n.x - b.x, n.z - b.z) < TILE * 0.5) { b.path.shift(); n = b.path[0]; }
  if (n && speed > 0) {
    const dx = n.x - b.x, dz = n.z - b.z, len = Math.hypot(dx, dz) || 1;
    b.x += dx / len * speed * dt; b.z += dz / len * speed * dt;
    b.walk += dt * speed * 0.55;
    b.angle = Math.atan2(dx, dz);
  }

  // Rendu : on cache le monstre hors ligne de vue, sinon on le verrait à
  // travers les murs.
  b.obj.visible = los(G.px, G.pz, b.x, b.z) && d < STAGES[G.stage].fog * 1.6;
  b.obj.position.set(b.x, b.def.height * 0.52, b.z);
  if (b.lamp) b.lamp.position.set(b.x, b.def.height * 0.5, b.z);
  b.obj.rotation.y = b.angle + Math.PI;
  animateLimbs(b.obj, b.walk, speed > 0 ? 0.75 : 0.05);
  if (b.obj.userData.glow)
    b.obj.userData.glow.intensity = (b.mode === "hunt" ? 1.9 : 0.8) + Math.sin(G.time * 6) * 0.25;

  if (d <= s.catch) caught(b);
}

// Frapper : ça étourdit, ça ne tue pas. Exactement comme dans le jeu Roblox —
// CombatService ne retire jamais de vie à un monstre.
function swing() {
  if (!G.running || sheet || G.sleeping || G.dead > 0) return;
  const w = weaponOf();
  if (!w) { toast("À mains nues, non. Achète une arme.", "warn"); return; }
  if (G.time < G.nextSwing) return;
  G.nextSwing = G.time + w.cd;
  let best = null, bd = 7;
  for (const b of G.beasts) {
    const d = Math.hypot(b.x - G.px, b.z - G.pz);
    if (d < bd) { bd = d; best = b; }
  }
  sfx.step();
  if (!best) return;
  best.stun = Math.max(best.stun, w.stun);
  best.mode = "search"; best.path = [];
  toast(`${w.name} — ${best.def.name} recule.`, "info");
  sfx.sting();

  // Le boss recule d'une phase tous les N coups encaissés. Tenir les trois
  // phases, c'est la victoire : il ne meurt pas de dégâts.
  if (best.def.rule === "boss_phases") {
    G.bossHits++;
    const ph = BOSS_PHASES[Math.min(G.bossPhase, BOSS_PHASES.length - 1)];
    if (G.bossHits >= ph.hits) {
      G.bossHits = 0;
      if (G.bossPhase < BOSS_PHASES.length - 1) {
        G.bossPhase++;
        const nx = BOSS_PHASES[G.bossPhase];
        toast(nx.text, "danger");
        G.shoutText = "PHASE " + (G.bossPhase + 1); G.shoutUntil = G.time + 2.4;
      } else {
        despawn(best); G.beasts.splice(G.beasts.indexOf(best), 1);
        G.seen.carnival_cleared = true; save();
        toast("Le clown est tombé. Le carnaval se tait.", "unlock");
        sfx.unlock();
      }
    }
  }
}

function caught(b) {
  if (G.dead > 0) return;
  const z = zone();
  wake("caught");
  const lost = Math.floor(G.unbanked * z.loss);
  G.unbanked = Math.max(0, Math.floor(G.unbanked - lost));
  G.deaths++; save();
  toast(`${b.def.name} t'a eu. −${money(lost)} (${Math.round(z.loss * 100)} % de ce que tu portais).`, "danger");
  G.dead = 2.4; G.shake = 1.6;
  sfx.sting();
  G.shoutText = "IL T'A EU"; G.shoutUntil = G.time + 2.4;
  b.mode = "patrol"; b.path = [];
}

// ─── entrées ───────────────────────────────────────────────────────────────
// ⚠️ LE POINT QUI CASSAIT ZQSD
//
// Une touche a deux identités, et il faut lire les DEUX :
//   · `e.key`  — ce qui est ÉCRIT dessus. Sur un AZERTY, la touche en haut à
//                gauche des lettres rend "a" ; sur un QWERTY, "q".
//   · `e.code` — OÙ elle se trouve, indépendamment de la disposition. Cette
//                même touche rend "KeyQ" sur les deux claviers.
//
// Ne lire que `e.key` oblige à énumérer toutes les dispositions du monde ;
// ne lire que `e.code` fait jouer un Français avec les doigts d'un Américain.
// On enregistre donc la lettre ET la position, et le déplacement accepte les
// deux. Résultat : ZQSD, WASD, QWERTZ et les flèches marchent tous, sans
// réglage et sans détection de clavier.
const keys = {};
let tv = { x: 0, y: 0, on: false };
const isTouch = matchMedia("(hover: none) and (pointer: coarse)").matches;

function setKey(e, down) {
  const k = (e.key || "").toLowerCase();
  if (k) keys[k] = down;
  const c = e.code || "";
  // Les positions sont préfixées par « # » pour ne jamais être confondues
  // avec une lettre : "#w" est « la touche où se trouve le W d'un QWERTY ».
  if (c.startsWith("Key")) keys["#" + c.slice(3).toLowerCase()] = down;
  else if (c) keys["#" + c.toLowerCase()] = down;
}
const held = (...names) => names.some(n => keys[n] === true);

// Avancer : W (QWERTY), Z (AZERTY), flèche haut, ou la POSITION du W.
const FWD = ["w", "z", "arrowup", "#w", "#arrowup"];
const BACK = ["s", "arrowdown", "#s", "#arrowdown"];
const LEFT = ["a", "q", "arrowleft", "#a", "#arrowleft"];
const RIGHT = ["d", "arrowright", "#d", "#arrowright"];
const RUN = ["shift", "#shiftleft", "#shiftright"];

addEventListener("keydown", (e) => {
  setKey(e, true);
  const k = (e.key || "").toLowerCase(), c = e.code || "";

  // ⚠️ LA RAISON POUR LAQUELLE « ZQSD NE MARCHE PAS »
  //
  // Un panneau ouvert met la partie en pause — c'est voulu : la révélation
  // d'un monstre doit arrêter le temps pour qu'on lise sa contre-mesure. Mais
  // de l'autre côté de l'écran, le joueur appuie sur ZQSD et RIEN ne bouge. Il
  // en conclut, très raisonnablement, que les touches sont cassées.
  //
  // Donc : une touche de déplacement ferme le panneau et relance la partie.
  // Sauf l'écran-titre, où il faut vraiment cliquer (il y a du son à démarrer,
  // et les navigateurs exigent un vrai clic pour l'autoriser).
  if (sheet && sheet !== "title" && held(...FWD, ...BACK, ...LEFT, ...RIGHT, ...RUN)) {
    closeSheet(); G.running = true;
    return;
  }
  if (k === " " || c === "Space") { e.preventDefault(); if (G.sleeping) wake("manual"); }
  if (k === "e" || c === "KeyE") { e.preventDefault(); interact(); }
  if (k === "f" || c === "KeyF") { e.preventDefault(); swing(); }
  if (k === "n" || c === "KeyN") { e.preventDefault(); if (sheet === "zones") { closeSheet(); G.running = true; } else zonesSheet(); }
  if (k === "m" || c === "KeyM") { setSound(!SFX.on); return; }
  if (k === "escape") {
    if (sheet) { closeSheet(); G.running = true; }
    else if (G.running) pause();
  }
});
addEventListener("keyup", (e) => setKey(e, false));
// Sans ça, changer d'onglet pendant qu'on avance laisse la touche « enfoncée »
// et le personnage part tout seul au retour.
addEventListener("blur", () => { for (const k in keys) keys[k] = false; });

const cv = $("cv");
let locked = false;
cv.addEventListener("click", () => {
  if (!G.running || isTouch) return;
  if (cv.requestPointerLock) { try { cv.requestPointerLock(); } catch (e) {} }
});
document.addEventListener("pointerlockchange", () => {
  locked = document.pointerLockElement === cv;
  $("cross").hidden = !locked;
});
addEventListener("mousemove", (e) => {
  if (!G.running) return;
  if (locked) {
    G.yaw -= e.movementX * 0.0022;
    G.pitch = Math.max(-0.75, Math.min(0.42, G.pitch - e.movementY * 0.0018));
  } else if (dragging) {
    G.yaw -= (e.clientX - dragX) * 0.005;
    G.pitch = Math.max(-0.75, Math.min(0.42, G.pitch - (e.clientY - dragY) * 0.004));
    dragX = e.clientX; dragY = e.clientY;
  }
});
let dragging = false, dragX = 0, dragY = 0;
cv.addEventListener("mousedown", (e) => {
  if (locked) { swing(); return; }
  dragging = true; dragX = e.clientX; dragY = e.clientY;
});
addEventListener("mouseup", () => { dragging = false; });

function interact() {
  if (sheet || G.sleeping || G.dead > 0) return;
  if (Math.hypot(G.px - vault.x, G.pz - vault.z) < 12) {
    const got = bank();
    toast(got > 0 ? `+${money(got)} déposés. C'est à toi pour de bon.` : "Tu n'as rien sur toi.",
      got > 0 ? "cash" : "info");
    return;
  }
  if (Math.hypot(G.px - shop.x, G.pz - shop.z) < 12) { shopSheet(); return; }
  const s = nearShelter(); if (s) trySleep(s);
}

if (isTouch) {
  $("touch").classList.add("on");
  const st = $("stick"), kn = $("knob");
  let o = null;
  const begin = (e) => { const r = st.getBoundingClientRect(); o = { x: r.left + r.width / 2, y: r.top + r.height / 2 }; mv(e); };
  const mv = (e) => {
    if (!o) return; e.preventDefault();
    const t = e.touches[0];
    let dx = t.clientX - o.x, dy = t.clientY - o.y;
    const len = Math.hypot(dx, dy), max = 46;
    if (len > max) { dx = dx / len * max; dy = dy / len * max; }
    kn.style.transform = `translate(${dx}px,${dy}px)`;
    tv = { x: dx / max, y: dy / max, on: len > 6 };
  };
  const end = () => { o = null; kn.style.transform = ""; tv = { x: 0, y: 0, on: false }; };
  st.addEventListener("touchstart", begin, { passive: false });
  st.addEventListener("touchmove", mv, { passive: false });
  st.addEventListener("touchend", end); st.addEventListener("touchcancel", end);
  $("tb-e").onclick = interact;
  $("tb-sp").onclick = () => { if (G.sleeping) wake("manual"); else swing(); };
  $("tb-n").onclick = () => { if (sheet === "zones") { closeSheet(); G.running = true; } else zonesSheet(); };
  // Glisser sur la vue fait tourner la caméra.
  let lx = null;
  cv.addEventListener("touchstart", (e) => { lx = e.touches[0].clientX; }, { passive: true });
  cv.addEventListener("touchmove", (e) => {
    if (lx === null) return;
    G.yaw -= (e.touches[0].clientX - lx) * 0.006;
    lx = e.touches[0].clientX;
  }, { passive: true });
  cv.addEventListener("touchend", () => { lx = null; });
}

// ─── déplacement ───────────────────────────────────────────────────────────
function movePlayer(dt) {
  let ix = 0, iz = 0;
  if (held(...FWD)) iz -= 1;
  if (held(...BACK)) iz += 1;
  if (held(...LEFT)) ix -= 1;
  if (held(...RIGHT)) ix += 1;
  if (tv.on) { ix = tv.x; iz = tv.y; }

  const len = Math.hypot(ix, iz);
  G.moving = len > 0.08 && !G.sleeping && G.dead <= 0;

  // Courir vide la jauge en 3,2 s et met 5,5 s à revenir : c'est une porte de
  // sortie, pas une vitesse de croisière.
  // `winded` est indispensable : sans lui la jauge se stabilise pile sous le
  // seuil et on sprinte en saccades indéfiniment. Une fois à sec, il faut
  // remonter à 30 % avant de pouvoir repartir.
  const wants = held(...RUN) || (tv.on && Math.hypot(tv.x, tv.y) > 0.92);
  G.sprint = !!(wants && G.moving && !G.winded && G.stam > 0);
  if (G.sprint) {
    G.stam = Math.max(0, G.stam - dt / 3.2);
    if (G.stam === 0) { G.winded = true; G.sprint = false; toast("Plus de souffle.", "info"); }
  } else {
    G.stam = Math.min(1, G.stam + dt / 5.5);
    if (G.stam > 0.3) G.winded = false;
  }

  if (!G.moving) return;
  ix /= len; iz /= len;

  // Déplacement relatif à la caméra : avancer, c'est aller là où on regarde.
  // yaw 0 regarde vers −Z, donc l'avant est (−sin, −cos) et la droite
  // (cos, −sin). Les signes inversés faisaient partir le joueur VERS la caméra
  // dès que la vue n'était pas pile dans l'axe.
  const sin = Math.sin(G.yaw), cos = Math.cos(G.yaw);
  const dx = ix * cos + iz * sin;
  const dz = -ix * sin + iz * cos;

  const sp = PLAYER_SPEED * (G.sprint ? 1.55 : 1);
  const step = sp * dt;
  const R = 1.6;
  // Glissement le long des murs : chaque axe est testé séparément, avec un
  // rayon pour que le personnage ne rentre pas dans la géométrie.
  if (!solid(G.px + dx * step + Math.sign(dx) * R, G.pz)) G.px += dx * step;
  if (!solid(G.px, G.pz + dz * step + Math.sign(dz) * R)) G.pz += dz * step;
  G.walk += dt * sp * 0.5;
  // Un pas par demi-cycle de jambes : le son colle à l'animation.
  if (G.walk >= G.nextStep) { G.nextStep = G.walk + Math.PI; (G.sprint ? sfx.run : sfx.step)(); }
}

// ─── boucle ────────────────────────────────────────────────────────────────
function start() {
  // On arrive au parvis. Entrer directement dans la rue, c'était lâcher le
  // joueur dans le noir sans lui avoir dit une seule règle.
  G.zone = "hub"; G.preview = false;
  G.signSeen = {}; G.portalLock = 0;
  hemi.intensity = 0.5;
  buildZone(G.zone);
  buildWorldMeshes();
  scene.fog.color.setHex(pal().fog);
  renderer.setClearColor(pal().fog);
  G.px = spawn.x; G.pz = spawn.z; G.dead = 0;
  G.unbanked = 0; G.sleeping = null; G.awaken = 0; G.stage = 0; G.toasts = [];
  G.placed = {}; G.defHits = {}; G.bossPhase = 0; G.bossHits = 0;
  clearBeasts();
  $("hud").hidden = false;
  G.running = true;
  toast("Le parvis. Trois bornes à lire, sept portails au fond.", "info");
}

function promptLine() {
  if (G.sleeping || G.dead > 0) return false;
  const p = $("prompt");
  // Le portail le plus proche : on annonce où il mène AVANT d'y entrer.
  let near = null, nd = 16;
  for (const pt of portals) {
    const d = Math.hypot(G.px - pt.x, G.pz - pt.z);
    if (d < nd) { nd = d; near = pt; }
  }
  if (near) {
    const z = ZONE_BY_ID[near.to];
    if (near.to === "hub") {
      p.innerHTML = `↩ <b>traverse</b> pour retourner au parvis`;
    } else {
      const open = zoneUnlocked(z);
      p.innerHTML = `<b>traverse</b> → ${z.name} · ${money(z.rate)}/s`
        + (open ? "" : ` · <span style="color:var(--danger)">aperçu, ${money(z.unlock)} déposés pour la débloquer</span>`);
    }
    return true;
  }
  const sg = nearSign();
  if (sg) { p.innerHTML = `<b>${sg.title}</b> — ${sg.text}`; return true; }
  if (Math.hypot(G.px - vault.x, G.pz - vault.z) < 12) {
    p.innerHTML = `<b>E</b> déposer ${money(G.unbanked)} au coffre`; return true;
  }
  if (Math.hypot(G.px - shop.x, G.pz - shop.z) < 12) {
    p.innerHTML = `<b>E</b> ouvrir la boutique`; return true;
  }
  const s = nearShelter();
  if (s) {
    const z = zone();
    p.innerHTML = G.preview
      ? `<b>E</b> dormir (aperçu — les gains ne comptent pas) · ${s.kind}`
      : `<b>E</b> dormir · ${s.kind} · ${money(z.rate)}/s · ${mmss(z.max)}`;
    return true;
  }
  return false;
}

function resize() {
  const w = cv.clientWidth, h = cv.clientHeight;
  renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(1, h);
  // En portrait, un champ vertical fixe écrase le champ horizontal : on ne voit
  // plus que le dos du personnage. On élargit jusqu'à 94° pour compenser.
  const base = 72 * Math.PI / 180;
  camera.fov = camera.aspect < 1
    ? Math.min(94, 2 * Math.atan(Math.tan(base / 2) / camera.aspect) * 180 / Math.PI)
    : 72;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  if (G.running) {
    G.time += dt;
    const z = zone();
    if (G.dead > 0) { G.dead -= dt; if (G.dead <= 0) { G.px = spawn.x; G.pz = spawn.z; } }
    movePlayer(dt);

    if (G.sleeping) {
      // Délai de grâce : on ne gagne rien les trois premières secondes, sinon
      // s'allonger une seconde entre deux courses paierait.
      if (G.graceLeft > 0) {
        G.graceLeft -= dt;
      } else {
        // Plafond souple : au-delà, le taux est divisé par quatre. Sans ça, la
        // zone 7 à 100 000 $/s rend toute la progression précédente inutile.
        const capped = G.earnedHere >= z.cap;
        const rate = z.rate * STAGES[G.stage].reward / (capped ? SOFTCAP_DIV : 1);
        const gain = rate * dt;
        G.earnedHere += gain;
        // En aperçu, on voit tout mais on ne gagne rien : la progression reste
        // honnête.
        if (!G.preview) G.unbanked += gain;
        // L'éveil monte avec la profondeur de la zone, pas avec le temps passé
        // n'importe où : dormir dans la rue ne réveille rien.
        G.awaken += gainFor(z.order) * dt;
      }
      G.sessionLeft -= dt;
      if (G.incoming > 0) {
        G.incoming -= dt;
        if (G.incoming <= 0) { G.incoming = 0; wake("assault"); }
      } else if (G.time >= G.nextAssault) {
        G.nextAssault = G.time + ASSAULT_BASE + (Math.random() - 0.5) * ASSAULT_JITTER;
        launchAssault();
      }
      if (G.sessionLeft <= 0) wake("complete");
    } else {
      // La jauge redescend dès que personne ne dort profond.
      G.awaken = Math.max(0, G.awaken - DECAY * dt);
    }

    let st = 0;
    for (let i = 0; i < THRESHOLDS.length; i++) if (G.awaken >= THRESHOLDS[i]) st = i;
    if (st !== G.stage) {
      const up = st > G.stage;
      G.stage = st;
      toast(`ÉVEIL — ${STAGES[st].name} : ${STAGES[st].text}`, st >= 2 ? "danger" : "info");
      if (up && st >= 2) G.shake = Math.max(G.shake, 0.5);
    }

    // Les portails. On les traverse, on ne les « active » pas : c'est plus
    // direct que d'appuyer sur une touche, et ça se comprend sans explication.
    if (!G.sleeping && G.dead <= 0 && G.time >= G.portalLock) {
      const pt = portalUnder();
      if (pt) { sfx.door(); travel(pt.to); }
    }
    // La nappe des portails ondule : un portail immobile ressemble à un mur.
    for (const pt of portals)
      if (pt.sheet) pt.sheet.material.opacity = 0.32 + 0.16 * Math.sin(G.time * 2.2 + pt.x);

    // Les bornes se lisent en passant, une seule fois chacune.
    const sg = nearSign();
    if (sg && !G.signSeen[sg.title]) {
      G.signSeen[sg.title] = true;
      toast(`${sg.title} — ${sg.text}`, "info");
    }

    for (const b of G.beasts.slice()) updateBeast(b, dt);

    const before = G.toasts.length;
    G.toasts = G.toasts.filter(t => t.until > G.time);
    if (G.toasts.length !== before) drawToasts();
    syncHud();

    const sh = $("shout");
    if (G.time < G.shoutUntil) {
      sh.hidden = false;
      const left = G.shoutUntil - G.time;
      sh.textContent = G.shoutText
        + (G.shoutText === "IL ARRIVE — COURS" ? "  " + left.toFixed(1).replace(".", ",") + " s" : "");
      $("tint").style.opacity = String(0.1 + 0.07 * Math.abs(Math.sin(G.time * 7)));
    } else { sh.hidden = true; $("tint").style.opacity = "0"; }
    $("vig").classList.toggle("hot", G.dead > 0 || G.time < G.shoutUntil);
    $("prompt").hidden = !promptLine();

    // Ambiance : le brouillard se resserre quand l'éveil monte. C'est ce qui
    // fait sentir le stade sans lire la jauge.
    // Au parvis on voit loin : c'est une zone sûre, et il faut apercevoir les
    // sept portails depuis le point d'arrivée. Ailleurs, le brouillard fait
    // son travail d'horreur.
    const fog = STAGES[G.stage].fog * (G.zone === "hub" ? 2.4 : 1);
    scene.fog.far += (fog - scene.fog.far) * Math.min(1, dt * 2);
    if (SFX.filter) {
      SFX.filter.frequency.value += (170 + G.stage * 95 - SFX.filter.frequency.value) * Math.min(1, dt);
      SFX.drone.gain.value = 0.045 + G.stage * 0.016;
    }
    // Battements de cœur : plus le monstre est près, plus c'est rapide.
    let near = 1e9;
    for (const b of G.beasts) near = Math.min(near, Math.hypot(b.x - G.px, b.z - G.pz));
    if (near < 58 && G.dead <= 0) {
      const t = Math.min(1, (58 - near) / 58);
      if (G.time >= SFX.beat) { sfx.heart(0.4 + t); SFX.beat = G.time + 1.1 - 0.6 * t; }
    } else SFX.beat = 0;
    G.shake = Math.max(0, G.shake - dt * 1.4);
    scene.fog.near = scene.fog.far * 0.12;
    torch.distance = fog * 1.1;
  }

  // Personnage et caméra
  const bodyY = G.sleeping ? 1.6 : 3.2;
  player.position.set(G.px, bodyY, G.pz);
  player.rotation.y = G.yaw;   // il regarde devant lui, pas vers la caméra
  player.rotation.x = G.sleeping ? -Math.PI / 2.1 : 0;
  player.visible = G.dead <= 0;
  animateLimbs(player, G.walk, G.moving ? 0.8 : 0.05);
  // La torche éclaire depuis le dessus et VISE le joueur : c'est ce qui donne
  // une ombre portée nette au lieu d'une tache uniforme.
  torch.position.set(G.px, 11.5, G.pz);
  torch.target.position.set(G.px, 0, G.pz);
  torch.target.updateMatrixWorld();

  // La caméra se rapproche quand un mur se met derrière le joueur, sinon on
  // se retrouve à jouer face à une paroi grise.
  const sy = Math.sin(G.yaw), cy = Math.cos(G.yaw);
  // Écran étroit : on recule un peu plus, sinon le personnage mange la vue.
  const base = (G.sleeping ? 11 : 13) * (camera.aspect < 1 ? 1.25 : 1);
  let dist = base;
  // On descend jusqu'à 5 studs s'il le faut : s'arrêter plus tôt laisse la
  // caméra DANS le mur, et on joue en regardant une texture de brique.
  while (dist > 5 && solid(G.px + sy * (dist + 1.5), G.pz + cy * (dist + 1.5))) dist -= 1;
  // Dans un coin, même 5 studs peuvent être dans la pierre : on vérifie le
  // point de la caméra lui-même. Mais jamais en dessous de 3,5 studs — sinon
  // la caméra finit DANS la tête du personnage et on joue dans le noir.
  while (dist > 3.5 && solid(G.px + sy * dist, G.pz + cy * dist)) dist -= 0.5;
  // Et si à 3,5 studs c'est ENCORE de la pierre — un couloir étroit, un angle
  // fermé — on continue à se rapprocher par pas fins, puis on monte un peu.
  //
  // ⚠️ La première version de ce correctif passait d'un coup à 2,2 studs avec
  // +4,5 de hauteur : résultat, une vue quasi verticale sur le crâne du
  // personnage dans TOUTE pièce un peu petite. La chambre d'hôpital fait
  // 10×8 studs ; à 13 studs de recul on touche forcément un mur. Le bon
  // réflexe n'est pas de basculer en plongée, c'est de se rapprocher.
  let lift = 0;
  while (dist > 2.2 && solid(G.px + sy * dist, G.pz + cy * dist)) dist -= 0.3;
  if (solid(G.px + sy * dist, G.pz + cy * dist)) lift = 0.9;
  // ⚠️ LA HAUTEUR DOIT SUIVRE LE RECUL.
  //
  // Elle était fixe à 6,5 studs. Dans une grande salle, la caméra est à 13
  // studs derrière : l'angle de plongée vaut 27°, c'est une vue d'épaule
  // normale. Mais dans une chambre d'hôpital ou un stand de carnaval, le
  // recul tombe à 2,2 studs — et à 6,5 de haut pour 2,2 de recul, on regarde
  // le crâne du personnage à 71° de plongée. C'est ce qui donnait ces images
  // écrasées où l'on ne voit que le sol.
  //
  // En la liant au recul, l'angle reste constant quelle que soit la pièce.
  const height = 2.0 + dist * 0.35 + G.pitch * -10 + lift;
  // Balancement de marche + secousse quand on se fait attraper.
  const bob = G.moving ? Math.sin(G.walk * 2) * (G.sprint ? 0.55 : 0.32) : 0;
  const sh2 = G.shake * G.shake;
  camera.position.set(
    G.px + sy * dist + (Math.random() - 0.5) * sh2 * 2.2,
    Math.min(11.6, bodyY + height + bob) + (Math.random() - 0.5) * sh2 * 2.2,
    G.pz + cy * dist + (Math.random() - 0.5) * sh2 * 2.2
  );
  fill.position.set(camera.position.x, camera.position.y, camera.position.z);
  camera.lookAt(G.px, bodyY + 1.4, G.pz);

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// ─── départ ────────────────────────────────────────────────────────────────
load();
try { if (localStorage.getItem("sleepordie.snd") === "0") SFX.on = false; } catch (e) {}
setSound(SFX.on);
buildZone(G.zone);
buildWorldMeshes();
scene.fog.color.setHex(pal().fog);
renderer.setClearColor(pal().fog);
G.px = spawn.x; G.pz = spawn.z;
resize();
title();
requestAnimationFrame(frame);

</script>
